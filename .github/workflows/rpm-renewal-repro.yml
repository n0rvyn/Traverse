# Temporary exact-artifact diagnosis; remove after this failure is resolved.
name: Reproduce retained ARM RPM renewal
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check reproduction source
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Download the exact failed package set
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: failed-acceptance-packages-aarch64
          path: dist
          github-token: ${{ github.token }}
          run-id: 43523434372
      - name: Verify retained package identity and build only its pinned CA fixture
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y curl patch
          python3 packaging/build-issuer.py --work .work --stage .work/unused-runtime-stage --sources .work/unused-source-stage --test-ca-only
          test ! -e .work/unused-runtime-stage
      - name: Reproduce unchanged installed renewal acceptance on the same Fedora image
        run: |
          docker run --rm --sysctl net.ipv4.ip_unprivileged_port_start=1024 --cap-add SYS_PTRACE -v "$PWD:/src" -w /src fedora@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e bash tests/reproduce_managed_renewal.sh
      - name: Preserve synthetic state only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: rpm-renewal-reproduction-${{ github.run_id }}
          path: |
            .work/renewal-diagnostics/*.json
            .work/private-ca-build.json
          if-no-files-found: ignore
