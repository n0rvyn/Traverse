name: Diagnose existing RPM artifacts
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Failed CI run containing failed-acceptance-packages artifacts
        required: true
        default: '43336300279'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: aarch64
            image: almalinux@sha256:5a4b41a427c9717be8f4ac2a32aa22efbae5f9124fbcb79a6765394f312acfe8
            suite: dns
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: failed-acceptance-packages-${{ matrix.arch }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify existing payload and recover its expected manifest
        env:
          RPM_ARCH: ${{ matrix.arch }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json,os,tarfile
          from pathlib import Path
          archive=Path('dist')/('traverse-0.1.0-'+os.environ['RPM_ARCH']+'.tar.gz')
          with tarfile.open(archive) as source:
              names=[name for name in source.getnames() if name.endswith('/share/traverse/runtime-manifest.json')]
              assert len(names)==1,names
              data=source.extractfile(names[0]).read()
          value=json.loads(data);assert value['architecture']==os.environ['RPM_ARCH']
          destination=Path('.work/stage/opt/traverse/share/traverse/runtime-manifest.json')
          destination.parent.mkdir(parents=True);destination.write_bytes(data)
          script=Path('packaging/test-rpm.sh').read_text()
          marker='python3 /src/tests/installed_wayland_controller.py\n'
          assert script.count(marker)==1
          Path('.work/rpm-prepare.sh').write_text(script.split(marker)[0])
          print(json.dumps({'scope':'Diagnostic fixture against existing artifact, not new acceptance','artifactSource':value['sourceCommit'],'architecture':value['architecture']}))
          PY
      - name: Run targeted original assertions with failure diagnostics
        env:
          RPM_IMAGE: ${{ matrix.image }}
          RPM_SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm --sysctl net.ipv4.ip_unprivileged_port_start=1024 --cap-add SYS_PTRACE \
            -v "$PWD:/src" -w /src -e TRAVERSE_TEST_DNS_DIAGNOSTICS=1 \
            -e RPM_SUITE "$RPM_IMAGE" bash -euc '
              bash .work/rpm-prepare.sh
              if [[ "$RPM_SUITE" == dns ]]; then
                python3 tests/readiness_observer_test.py --prefix /opt/traverse
              else
                gcc tests/x11_input_probe.c -o /tmp/x11-probe -lX11 -lXtst
                for trial in 1 2 3; do
                  echo "Fresh setup diagnostic trial $trial"
                  xvfb-run -a python3 tests/installed_host_window.py
                done
              fi
            '
