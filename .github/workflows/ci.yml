name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and release-policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n packaging/build-runtime.sh packaging/test-deb.sh packaging/test-rpm.sh
      - run: sh -n packaging/runtime-entry.sh
  packages:
    needs: source
    uses: ./.github/workflows/packages.yml
