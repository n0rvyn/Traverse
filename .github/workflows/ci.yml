name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and release-policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test optional gateway namespace matcher
        working-directory: packaging/proxy
        env:
          GOTOOLCHAIN: go1.27.4
        run: go test -mod=readonly -p 1 ./...
      - run: bash -n packaging/build-runtime.sh packaging/test-deb.sh packaging/test-rpm.sh packaging/test-host-owner.sh packaging/test-host-chrome.sh packaging/test-gentoo-host.sh
      - run: sh -n packaging/runtime-entry.sh packaging/host-entry.sh packaging/configure-runtime.sh packaging/deb-postinst.sh packaging/deb-postrm.sh
  packages:
    needs: source
    uses: ./.github/workflows/packages.yml
  host:
    name: Internal host checks (${{ matrix.arch }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build internal Qt target and run unprivileged protocol/storage tests
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:22.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends cmake build-essential qt6-base-dev libgl-dev libssl-dev nlohmann-json3-dev python3 openssl dbus
            install -d -o 65534 -g 65534 /tmp/traverse-host-build
            runuser -u nobody -- cmake -S /src/host -B /tmp/traverse-host-build -DCMAKE_BUILD_TYPE=Release
            runuser -u nobody -- cmake --build /tmp/traverse-host-build -j2
            runuser -u nobody -- ctest --test-dir /tmp/traverse-host-build --output-on-failure
          '
