name: Build Linux packages
on:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  linux:
    name: Packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Build on the declared glibc baseline
        id: build
        run: |
          docker pull ubuntu:22.04
          image=$(docker image inspect ubuntu:22.04 --format '{{index .RepoDigests 0}}')
          docker run --rm --sysctl net.ipv4.ip_unprivileged_port_start=1024 --cap-add SYS_PTRACE --cap-add NET_ADMIN -e BUILD_BASE_IMAGE="$image" -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -v "$PWD:/src" -w /src "$image" bash packaging/build-runtime.sh
      - name: Test actual installed DEB and relocated runtime
        run: |
          docker run --rm --sysctl net.ipv4.ip_unprivileged_port_start=1024 --cap-add SYS_PTRACE -v "$PWD:/src" -w /src ubuntu:22.04 bash packaging/test-deb.sh
      - name: Test installed host with ordinary Chrome at normal resolution
        if: matrix.arch == 'x86_64'
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y "$PWD"/dist/*.deb libnss3-tools python3-websocket xvfb xauth gcc libx11-dev libxtst-dev
          sudo bash packaging/test-host-chrome.sh
      - name: Test actual installed RPM
        run: |
          docker run --rm --sysctl net.ipv4.ip_unprivileged_port_start=1024 --cap-add SYS_PTRACE -v "$PWD:/src" -w /src fedora:44 bash packaging/test-rpm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Preserve synthetic Chrome acceptance evidence
        if: always() && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: chrome-evidence-${{ matrix.arch }}
          path: |
            .work/installed-chrome/*summary.json
            .work/installed-chrome/*pressure.jsonl
            .work/installed-chrome/*diagnostics.json
            .work/installed-chrome/*.png
            .work/installed-chrome/fresh-export-native.ppm
            .work/installed-chrome/failure-after-consumed-pairing.ppm
          if-no-files-found: ignore
      - name: Preserve synthetic installed-test failure images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: installed-test-failure-images-${{ matrix.arch }}
          path: .work/managed-failure-images/*.png
          if-no-files-found: ignore
      - name: Preserve packages from failed acceptance for diagnosis
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          # Release downloads only packages-*. Keep failed acceptance separate.
          name: failed-acceptance-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
