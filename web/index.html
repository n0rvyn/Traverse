<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Traverse · Remote desktop</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><span class="mark">↗</span> Traverse <span class="tag">REMOTE DESKTOP</span></div><div id="status" role="status"><span class="dot"></span><span id="state">Not connected</span></div></header>
<main><section id="pairing"><div class="eyebrow">YOUR DESKTOP, HERE</div><h1>A window to your Linux desktop.</h1><p>Enter the pairing code shown on the host.</p><form id="pairForm"><label for="code">Pairing code</label><div class="row"><input id="code" name="code" autocomplete="off" spellcheck="false" required><button id="connect" type="submit">Connect <span>↗</span></button></div></form><p id="error" role="alert"></p></section>
<section id="session" hidden><div class="toolbar"><div><span class="eyebrow">LIVE DESKTOP</span> <span id="resolution"></span></div><div class="actions"><button id="reconnect" class="secondary">Reconnect</button><button id="fullscreen" class="secondary">Full screen</button><button id="disconnect" class="secondary">Disconnect</button></div></div><div id="stage"><video id="desktop" autoplay playsinline muted tabindex="0" aria-label="Remote Linux desktop. Focus to control; Escape leaves full screen."></video><div id="overlay">Connecting…</div></div><footer><span id="metrics">Waiting for video</span><span id="inputState">Click the desktop to control</span></footer></section>
</main><script type="module" src="/client.js"></script></body></html>
